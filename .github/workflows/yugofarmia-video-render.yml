name: Render Yugofarmia cinematic film

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: yugofarmia-video

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yugofarmia-video/package.json

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Install project and browser
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture the live Yugofarmia experience
        run: |
          mkdir -p public/capture scripts out
          cat > scripts/capture.mjs <<'EOF'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {chromium} from 'playwright';

          const out = path.resolve('public/capture');
          await fs.mkdir(out, {recursive: true});
          const browser = await chromium.launch({headless: true});
          const context = await browser.newContext({
            viewport: {width: 1440, height: 900},
            deviceScaleFactor: 1,
            colorScheme: 'light',
          });
          const page = await context.newPage();
          page.setDefaultTimeout(45000);

          const shot = async (name, fullPage = false) => {
            await page.screenshot({path: path.join(out, name), fullPage});
          };

          const exists = async (name) => {
            try {
              await fs.access(path.join(out, name));
              return true;
            } catch {
              return false;
            }
          };

          const copyFallback = async (target, candidates) => {
            if (await exists(target)) return;
            for (const candidate of candidates) {
              if (await exists(candidate)) {
                await fs.copyFile(path.join(out, candidate), path.join(out, target));
                return;
              }
            }
            throw new Error(`No fallback available for ${target}`);
          };

          const domClick = async (locator) => {
            const target = locator.first();
            await target.waitFor({state: 'visible'});
            await target.scrollIntoViewIfNeeded().catch(() => {});
            await target.evaluate((element) => element.click());
            await page.waitForTimeout(650);
          };

          try {
            await page.goto('https://yugofarmia.com/en/prices', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(3000);
            await shot('01-prices-initial.png');

            const product = page.locator('input[placeholder="Product"]').first();
            await product.click();
            await page.waitForTimeout(500);
            await shot('02-product-open.png');
            await domClick(page.getByRole('option', {name: 'Potatoes', exact: true}));
            await page.waitForFunction(() => {
              const input = document.querySelector('input[placeholder="Country"]');
              return input && !input.disabled;
            });
            await shot('03-product-selected.png');

            const country = page.locator('input[placeholder="Country"]').first();
            await country.click();
            await page.waitForTimeout(500);
            await shot('04-country-open.png');
            await domClick(page.getByRole('option', {name: /Serbia/i}));
            await page.waitForFunction(() => {
              const input = document.querySelector('input[placeholder="Select period"]');
              return input && !input.disabled;
            });
            await shot('05-country-selected.png');

            const period = page.locator('input[placeholder="Select period"]').first();
            await period.click();
            await page.waitForTimeout(500);
            await shot('06-period-open.png');
            const latest = page.getByRole('option', {name: /Latest available/i});
            if (await latest.count()) {
              await domClick(latest);
            } else {
              const firstPeriod = page.locator('[role="option"]').first();
              await domClick(firstPeriod);
            }
            await shot('07-ready-to-search.png');

            await domClick(page.getByRole('button', {name: /Show results/i}));
            await page.waitForTimeout(3500);
            const resultAnchor = page.getByText(/official reference|source evidence|prices available/i).last();
            if (await resultAnchor.count()) {
              await resultAnchor.scrollIntoViewIfNeeded().catch(() => {});
              await page.waitForTimeout(800);
            }
            await shot('08-prices-results.png');
            await shot('08-prices-results-full.png', true);
          } catch (error) {
            await fs.writeFile(path.join(out, 'capture-price-error.txt'), String(error));
            await shot('capture-price-error.png').catch(() => {});
          }

          try {
            await page.goto('https://yugofarmia.com/en/products', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(2600);
            await shot('10-products.png');
            await shot('10-products-full.png', true);

            await page.goto('https://yugofarmia.com/en/products/potatoes', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForTimeout(2600);
            await shot('11-potatoes-detail.png');
            await shot('11-potatoes-detail-full.png', true);
          } catch (error) {
            await fs.writeFile(path.join(out, 'capture-products-error.txt'), String(error));
          }

          await context.close();
          await browser.close();

          await copyFallback('10-products.png', ['01-prices-initial.png']);
          await copyFallback('11-potatoes-detail.png', ['10-products.png', '01-prices-initial.png']);
          await copyFallback('01-prices-initial.png', ['10-products.png', '11-potatoes-detail.png']);
          await copyFallback('02-product-open.png', ['01-prices-initial.png']);
          await copyFallback('03-product-selected.png', ['02-product-open.png', '01-prices-initial.png']);
          await copyFallback('04-country-open.png', ['03-product-selected.png']);
          await copyFallback('05-country-selected.png', ['04-country-open.png', '03-product-selected.png']);
          await copyFallback('06-period-open.png', ['05-country-selected.png']);
          await copyFallback('07-ready-to-search.png', ['06-period-open.png', '05-country-selected.png']);
          await copyFallback('08-prices-results.png', ['11-potatoes-detail.png', '07-ready-to-search.png']);
          EOF
          node scripts/capture.mjs
          ls -lh public/capture

      - name: Generate original soundtrack and interaction audio
        run: |
          cat > scripts/audio.py <<'EOF'
          import math
          import random
          import struct
          import wave

          random.seed(42)
          RATE = 44100
          DURATION = 47.0
          N = int(RATE * DURATION)
          transition_times = [3.8, 7.6, 9.6, 13.2, 15.4, 22.4, 25.4, 27.8, 32.2, 36.4, 40.4, 42.6, 44.8]
          chords = [
              (110.0, 164.81, 220.0),
              (98.0, 146.83, 196.0),
              (87.31, 130.81, 174.61),
              (98.0, 146.83, 220.0),
          ]

          data = []
          for i in range(N):
              t = i / RATE
              chord = chords[int(t // 4.0) % len(chords)]
              pad = sum(math.sin(2 * math.pi * f * t + 0.14 * math.sin(t * 0.37)) for f in chord) / 3
              air = math.sin(2 * math.pi * 440 * t + math.sin(t * 0.19)) * 0.035
              pulse_phase = t % 0.5
              kick = 0.0
              if pulse_phase < 0.17:
                  kick = math.sin(2 * math.pi * (62 - 24 * pulse_phase / 0.17) * pulse_phase) * math.exp(-pulse_phase * 24)
              shaker_phase = t % 0.25
              shaker = 0.0
              if shaker_phase < 0.022:
                  shaker = (random.random() * 2 - 1) * math.exp(-shaker_phase * 115)
              chime = 0.0
              for marker in transition_times:
                  dt = t - marker
                  if 0 <= dt < 0.9:
                      chime += math.sin(2 * math.pi * 660 * dt) * math.exp(-dt * 4.2)
                      chime += 0.45 * math.sin(2 * math.pi * 990 * dt) * math.exp(-dt * 5.0)
              envelope = min(1.0, t / 1.2, max(0.0, (DURATION - t) / 2.0))
              value = envelope * (0.16 * pad + 0.045 * air + 0.16 * kick + 0.028 * shaker + 0.055 * chime)
              value = max(-0.92, min(0.92, value))
              left = int(value * 32767)
              right = int((value * 0.97 + 0.01 * math.sin(2 * math.pi * 0.23 * t)) * 32767)
              data.append(struct.pack('<hh', left, right))

          with wave.open('public/soundtrack.wav', 'wb') as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(RATE)
              wav.writeframes(b''.join(data))

          click_n = int(RATE * 0.18)
          click = []
          for i in range(click_n):
              t = i / RATE
              value = 0.52 * math.sin(2 * math.pi * 820 * t) * math.exp(-t * 42)
              value += 0.22 * math.sin(2 * math.pi * 1280 * t) * math.exp(-t * 64)
              sample = int(max(-0.9, min(0.9, value)) * 32767)
              click.append(struct.pack('<h', sample))
          with wave.open('public/click.wav', 'wb') as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(RATE)
              wav.writeframes(b''.join(click))
          EOF
          python scripts/audio.py
          ls -lh public/*.wav

      - name: Type-check
        run: npx tsc --noEmit

      - name: Render MP4 and cover
        run: |
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx remotion render src/index.ts YugofarmiaFilm out/yugofarmia-reference-direction.mp4 \
            --codec=h264 \
            --audio-codec=aac \
            --crf=18 \
            --pixel-format=yuv420p \
            --concurrency=4 \
            --browser-executable="$CHROME_PATH" \
            --overwrite
          npx remotion still src/index.ts YugofarmiaFilm out/yugofarmia-linkedin-cover.png \
            --frame=55 \
            --browser-executable="$CHROME_PATH" \
            --overwrite

      - name: Validate and package
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height,r_frame_rate \
            -of json out/yugofarmia-reference-direction.mp4 > out/video-metadata.json
          ffmpeg -hide_banner -loglevel error -y \
            -i out/yugofarmia-reference-direction.mp4 \
            -vf "fps=1/4.7,scale=480:-2,tile=5x2:padding=8:margin=8:color=white" \
            -frames:v 1 out/yugofarmia-contact-sheet.jpg
          zip -r out/yugofarmia-remotion-source.zip src public package.json tsconfig.json README.md \
            -x 'public/capture/*-full.png'
          ls -lh out

      - name: Upload finished film
        uses: actions/upload-artifact@v4
        with:
          name: yugofarmia-reference-direction-film
          path: |
            yugofarmia-video/out/yugofarmia-reference-direction.mp4
            yugofarmia-video/out/yugofarmia-linkedin-cover.png
            yugofarmia-video/out/yugofarmia-contact-sheet.jpg
            yugofarmia-video/out/yugofarmia-remotion-source.zip
            yugofarmia-video/out/video-metadata.json
          if-no-files-found: error
          retention-days: 2
