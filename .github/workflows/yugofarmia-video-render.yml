name: Render Yugofarmia guided website flow

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: yugofarmia-short-video

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yugofarmia-short-video/package.json

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Install project and browser
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture canonical live assets
        run: |
          mkdir -p public/live out
          node scripts/capture-assets.mjs
          ls -lh public/live

      - name: Generate original soundtrack
        run: |
          python scripts/audio.py
          ls -lh public/soundtrack.wav

      - name: Apply guided website-flow composition
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payload = ''.join(
              Path(f'scripts/flow-part-{index}.b64').read_text().strip()
              for index in range(1, 5)
          )
          Path('src/YugofarmiaShort.tsx').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          Path('src/Root.tsx').write_bytes(
              gzip.decompress(base64.b64decode(Path('scripts/root-flow.b64').read_text().strip()))
          )
          print('Applied guided website-flow source')
          PY

      - name: Type-check
        run: npx tsc --noEmit

      - name: Render MP4 and LinkedIn cover
        run: |
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f \( -name headless_shell -o -name chrome-headless-shell \) -perm -111 | head -n 1)"
          echo "Using browser: $CHROME_PATH"
          test -x "$CHROME_PATH"
          npx remotion render src/index.ts YugofarmiaShort out/yugofarmia-guided-website-flow.mp4 \
            --codec=h264 \
            --audio-codec=aac \
            --crf=18 \
            --pixel-format=yuv420p \
            --concurrency=4 \
            --browser-executable="$CHROME_PATH" \
            --overwrite
          npx remotion still src/index.ts YugofarmiaShort out/yugofarmia-guided-website-flow-cover.png \
            --frame=112 \
            --browser-executable="$CHROME_PATH" \
            --overwrite

      - name: Validate and package
        run: |
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,codec_type,width,height,r_frame_rate \
            -of json out/yugofarmia-guided-website-flow.mp4 > out/video-metadata.json
          ffmpeg -hide_banner -loglevel error -y \
            -i out/yugofarmia-guided-website-flow.mp4 \
            -vf "fps=1/2.5,scale=480:-2,tile=5x2:padding=8:margin=8:color=white" \
            -frames:v 1 out/yugofarmia-guided-website-flow-contact-sheet.jpg
          ffmpeg -hide_banner -i out/yugofarmia-guided-website-flow.mp4 \
            -af volumedetect -f null - 2> out/audio-qc.txt
          zip -r out/yugofarmia-guided-flow-remotion-source.zip \
            src scripts public package.json tsconfig.json README.md
          ls -lh out

      - name: Upload finished film
        uses: actions/upload-artifact@v4
        with:
          name: yugofarmia-guided-website-flow-film
          path: |
            yugofarmia-short-video/out/yugofarmia-guided-website-flow.mp4
            yugofarmia-short-video/out/yugofarmia-guided-website-flow-cover.png
            yugofarmia-short-video/out/yugofarmia-guided-website-flow-contact-sheet.jpg
            yugofarmia-short-video/out/yugofarmia-guided-flow-remotion-source.zip
            yugofarmia-short-video/out/video-metadata.json
            yugofarmia-short-video/out/audio-qc.txt
          if-no-files-found: error
          retention-days: 2
