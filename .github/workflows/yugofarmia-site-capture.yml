name: Yugofarmia short-video live capture

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture current Yugofarmia prices, sources, product images, and logo
        run: node yugofarmia-short/capture.mjs

      - name: Upload live capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugofarmia-short-live-capture
          path: yugofarmia-short/out
          if-no-files-found: error
          retention-days: 2
