name: Capture Yugofarmia real UI v4

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Patch capture navigation after exact row screenshots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('yugofarmia-real-ui-v4/capture.mjs')
          text = path.read_text()
          old = """  const cucumber = page.getByRole('button', {name: 'Cucumbers', exact: true});
          await moveClick(page, cucumber, 250, 900);"""
          new = """  await productInput.fill('Cucumbers');
          await sleep(450);
          const cucumber = page.getByRole('button', {name: 'Cucumbers', exact: true});
          await cucumber.click();
          await sleep(900);"""
          if old not in text:
              raise SystemExit('Expected cucumber selection snippet was not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Capture live Yugofarmia interactions and exact UI rows
        run: node yugofarmia-real-ui-v4/capture.mjs

      - name: Inventory capture
        if: always()
        run: |
          find yugofarmia-real-ui-v4/out -maxdepth 2 -type f -printf '%P\t%k KB\n' | sort || true

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugofarmia-real-ui-v4-capture
          path: yugofarmia-real-ui-v4/out
          if-no-files-found: error
          retention-days: 2
