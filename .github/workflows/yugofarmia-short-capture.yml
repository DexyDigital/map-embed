name: Yugofarmia short-video live capture

on:
  push:
    branches:
      - tmp/yugofarmia-short-video-20260821
    paths-ignore:
      - 'yugofarmia-short/live/**'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture current Yugofarmia data and assets
        run: node yugofarmia-short/capture.mjs

      - name: Publish capture to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf yugofarmia-short/live
          mv yugofarmia-short/out yugofarmia-short/live
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- yugofarmia-short/live
          git commit -m 'chore: add current Yugofarmia video data'
          git push origin HEAD:tmp/yugofarmia-short-video-20260821
