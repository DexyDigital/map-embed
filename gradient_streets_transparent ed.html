<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blue Map with Pulsing Green Dots</title>
<style>
  :root{
    --dot:#25d377;                 /* core green */
    --halo1: rgba(37,211,119,.42); /* inner halo */
    --halo2: rgba(95,196,209,.28); /* cyan ambient halo */
  }
  html, body { margin:0; height:100%; background:#f0f5ff; }
  .map {
    position: relative;
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    aspect-ratio: 16 / 11;        /* roughly your screenshot shape */
    border-radius: 18px;
    overflow: hidden;
    background: #e9eef8;
    box-shadow: 0 6px 28px rgba(0,0,0,.08);
  }
  .map > img.bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    pointer-events: none; user-select: none;
    display:block;
  }

  /* Pulsing dot */
  .dot{
    position:absolute;
    width:14px;height:14px;
    border-radius:50%;
    background:var(--dot);
    transform:translate(-50%,-50%);
    filter: drop-shadow(0 0 6px rgba(37,211,119,.6));
  }
  .dot::before{
    content:""; position:absolute; left:50%; top:50%;
    width:120px; height:120px; transform:translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(closest-side, var(--halo2) 0%, rgba(95,196,209,0) 70%);
    filter: blur(2px);
  }
  .dot::after{
    content:""; position:absolute; inset:-10px; border-radius:50%;
    background: var(--halo1);
    animation: pulse 2.1s ease-out infinite;
  }
  @keyframes pulse{
    0%   { transform: scale(.25); opacity:.95; }
    55%  { transform: scale(1.6); opacity:.45; }
    100% { transform: scale(2.4); opacity:0; }
  }
</style>
</head>
